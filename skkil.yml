version: 1
name: store

requires:
  - name: Go
    check: command -v go
    hint: install Go 1.26 or later
  - name: Rust
    check: command -v cargo
    hint: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
  - name: buf
    check: command -v buf
    hint: install buf (https://buf.build/docs/installation)
  - name: Java 25
    check: java -version 2>&1 | grep -q 'version "2[5-9]'
    hint: install a JDK 25
  - name: pnpm
    check: command -v pnpm
    hint: npm install -g pnpm
  - name: Docker
    check: command -v docker
    hint: install Docker for the Postgres-backed tests

dev:
  run:
    - name: postgres
      run: docker compose up
      dir: modules/service

ci:
  tasks:
    - name: protocol
      dir: modules/protocol
      lint: buf lint
      build: buf build -o /dev/null
    - name: service
      dir: modules/service
      format: test -z "$(gofmt -l .)"
      lint: go vet ./... && go tool staticcheck ./... && buf generate && git diff --exit-code -- gen
      test: go test -race ./...
      build: go build -o /dev/null ./cmd/store
    - name: adapter-jvm
      dir: modules/adapter-jvm
      format: ./gradlew spotlessCheck
      test: ./gradlew test
      build: ./gradlew build -x test
    - name: client-ts
      dir: modules/client-ts
      format: pnpm install --frozen-lockfile && pnpm format:check
      lint: pnpm install --frozen-lockfile && pnpm lint && pnpm check:generated
      test: pnpm install --frozen-lockfile && pnpm test
      build: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build
    - name: core
      dir: modules/core
      format: cargo fmt --check
      lint: >-
        cargo clippy --workspace --all-targets --locked -- -D warnings &&
        cargo clippy --target wasm32-unknown-unknown -p skkil-store-core -p skkil-store-http --all-targets --locked -- -D warnings &&
        cargo run -q -p protogen && git diff --exit-code -- crates/store-protocol/src/generated
      test: >-
        cargo test --workspace --locked &&
        cargo test --target wasm32-unknown-unknown -p skkil-store-core --test wasm --locked
      build: >-
        cargo build --workspace --locked &&
        cargo build --target wasm32-unknown-unknown -p skkil-store-core --locked &&
        cargo ndk -t arm64-v8a -t x86_64 build -p skkil-store-core --locked &&
        cargo check --target aarch64-apple-ios --target aarch64-apple-ios-sim -p skkil-store-core --no-default-features --locked
