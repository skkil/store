[package]
name = "skkil-store-core"
description = "Sans-IO client core for skkil store: local SQLite replica, outbox and rebase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "store_core"

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]

[dependencies]
skkil-store-protocol.workspace = true
prost.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
skkil-store-testkit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
sqlite-wasm-rs.workspace = true
wasm-bindgen-test.workspace = true

[lints]
workspace = true
