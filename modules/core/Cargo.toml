[workspace]
resolver = "3"
members = [
    "crates/store-protocol",
    "crates/store-core",
    "crates/store-http",
    "crates/store-testkit",
    "tools/protogen",
]
default-members = [
    "crates/store-protocol",
    "crates/store-core",
    "crates/store-http",
    "crates/store-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/skkil/store"

[workspace.dependencies]
skkil-store-protocol = { path = "crates/store-protocol", version = "0.1.0" }
skkil-store-core = { path = "crates/store-core", version = "0.1.0", default-features = false }
skkil-store-http = { path = "crates/store-http", version = "0.1.0" }
skkil-store-testkit = { path = "crates/store-testkit" }
prost = "0.14.4"
prost-build = "0.14.4"
rusqlite = "0.41.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.1", default-features = false, features = ["std", "v8", "serde"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
proptest = "1.12.0"
tiny_http = "0.12.0"
sqlite-wasm-rs = { version = "0.6.2", default-features = false, features = ["wasm-bindgen"] }
wasm-bindgen-test = "0.3.80"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
