name: skkil-store

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "55433:5432"
    volumes:
      - ../sql/migrations:/migrations:ro
      - ./dev/apply-migrations.sh:/docker-entrypoint-initdb.d/apply-migrations.sh:ro
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
